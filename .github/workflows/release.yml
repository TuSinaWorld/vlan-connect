name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          cat > release_notes.md <<EOF
          Automated build for ${RELEASE_TAG}.

          ## Assets

          - vlan-server-linux-x86_64
          - vlan-server-linux-arm64
          - vlan-cli-linux-x86_64
          - vlan-cli-linux-arm64
          - vlan-cli-windows-x86_64.exe
          - LICENSE.txt
          - NOTICE.txt

          ## Qt GUI Client and Qt Source

          Qt GUI client binaries may be uploaded manually by the project author.
          If a Qt GUI client binary is distributed, keep the project LICENSE.txt
          and NOTICE.txt with the package and preserve the applicable Qt license
          notices. The Qt 5.9.9 Open Source package and corresponding source code
          are available from the official Qt archive:

          - Qt 5.9.9 Open Source archive: https://download.qt.io/archive/qt/5.9/5.9.9/
          - Qt 5.9.9 source code (zip): https://download.qt.io/archive/qt/5.9/5.9.9/single/qt-everywhere-opensource-src-5.9.9.zip
          - Qt 5.9.9 source code (tar.xz): https://download.qt.io/archive/qt/5.9/5.9.9/single/qt-everywhere-opensource-src-5.9.9.tar.xz
          - Windows installer: https://download.qt.io/archive/qt/5.9/5.9.9/qt-opensource-windows-x86-5.9.9.exe
          EOF

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md
          else
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md
          fi

          cp LICENSE LICENSE.txt
          cp NOTICE NOTICE.txt
          gh release upload "$RELEASE_TAG" LICENSE.txt NOTICE.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  server-linux:
    name: Server Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Build server
        run: make
        working-directory: server

      - name: Upload server binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          cp server/vlan-server "server/vlan-server-linux-${ARCH}"
          gh release upload "$RELEASE_TAG" "server/vlan-server-linux-${ARCH}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  cli-linux:
    name: CLI Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Build CLI
        run: make
        working-directory: client-cli/linux

      - name: Upload CLI Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          cp client-cli/linux/vlan-cli "client-cli/linux/vlan-cli-linux-${ARCH}"
          gh release upload "$RELEASE_TAG" "client-cli/linux/vlan-cli-linux-${ARCH}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  cli-windows:
    name: CLI Windows
    runs-on: windows-2022
    needs: create-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Build CLI
        shell: cmd
        working-directory: client-cli/windows
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (
            echo Visual Studio C++ tools not found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          call build.bat

      - name: Upload CLI Windows binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        shell: cmd
        working-directory: client-cli/windows
        run: |
          copy vlan-cli.exe vlan-cli-windows-x86_64.exe
          gh release upload "%RELEASE_TAG%" "vlan-cli-windows-x86_64.exe" --repo "%GITHUB_REPOSITORY%" --clobber
