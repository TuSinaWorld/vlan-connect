name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_BUILD_IMAGE: ubuntu:20.04

jobs:
  tests-linux:
    name: Protocol and production tests Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qtbase5-dev

      - name: Configure isolated tests
        shell: bash
        run: cmake -S tests -B build-tests/linux/ci -DCMAKE_BUILD_TYPE=Release

      - name: Build isolated tests
        shell: bash
        run: cmake --build build-tests/linux/ci --parallel

      - name: Run isolated tests
        shell: bash
        run: ctest --test-dir build-tests/linux/ci --output-on-failure

      - name: Test real server and CLI authentication on loopback
        run: |
          make -C server -j2
          make -C client-cli/linux -j2
          python3 tests/server/production_auth_smoke.py --server server/vlan-server --cli client-cli/linux/vlan-cli

  server-linux:
    name: Server Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify server compatibility
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env VLAN_BUILD_COMMIT=${{ github.sha }} \
            "${LINUX_BUILD_IMAGE}" \
            bash .github/scripts/build-linux-glibc231.sh server x86_64

      - name: Upload server artifact
        if: ${{ vars.UPLOAD_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vlan-server-linux
          path: server/vlan-server
          if-no-files-found: error

  cli-linux:
    name: CLI Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify CLI compatibility
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env VLAN_BUILD_COMMIT=${{ github.sha }} \
            "${LINUX_BUILD_IMAGE}" \
            bash .github/scripts/build-linux-glibc231.sh cli x86_64

      - name: Upload CLI Linux artifact
        if: ${{ vars.UPLOAD_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vlan-cli-linux
          path: client-cli/linux/vlan-cli
          if-no-files-found: error

  cli-windows:
    name: CLI Windows
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CLI
        shell: cmd
        working-directory: client-cli/windows
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          if "%VSINSTALL%"=="" (
            echo Visual Studio C++ tools not found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          set VLAN_BUILD_COMMIT=${{ github.sha }}
          call build.bat

      - name: Upload CLI Windows artifact
        if: ${{ vars.UPLOAD_BUILD_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vlan-cli-windows
          path: client-cli/windows/vlan-cli.exe
          if-no-files-found: error

  tests-windows:
    name: Protocol and production tests Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt for isolated Windows tests
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true
      - name: Configure isolated tests
        run: cmake -S tests -B build-tests/windows/ci -A x64
      - name: Build isolated tests
        run: cmake --build build-tests/windows/ci --config Release --parallel
      - name: Run isolated tests
        run: ctest --test-dir build-tests/windows/ci -C Release --output-on-failure
